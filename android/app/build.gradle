apply plugin: "com.android.application"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// @react-native-firebase: google-services.json(android/app/) 을 읽어 Firebase 설정을
// 리소스로 주입한다. com.android.application 이후에 적용해야 한다.
apply plugin: "com.google.gms.google-services"
// @react-native-firebase/crashlytics: 네이티브 크래시 수집 + 매핑 업로드. google-services
// 이후에 적용한다(Firebase 설정이 먼저 주입돼야 함).
apply plugin: "com.google.firebase.crashlytics"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ── 출시 서명 안전장치(2026-07-30 감사 A-1) ──────────────────────────────────
// release 빌드는 업로드 키가 없으면 **조용히 debug 키로 폴백**한다(아래 signingConfig).
// 로컬 개발에는 편하지만 Play 는 debug 서명 업로드를 거부하고, 폴백이 조용하기 때문에
// 새 노트북·CI 처럼 ~/.gradle/gradle.properties 가 없는 환경에서 만든 산출물이 그대로
// 업로드돼 "원인 모를 거부"가 된다. 사람의 기억에 기댄 주석은 안전장치가 아니다.
//
// 그래서 release 산출물을 만드는 태스크가 실제로 실행될 때만 검사해 **빌드를 실패시킨다**
// (구성 단계에서 무조건 throw 하면 debug 빌드·IDE 동기화까지 막힌다).
// 기기 테스트용으로 debug 서명 release 가 필요하면 의도를 명령에 드러낸다:
//   ./gradlew assembleRelease -PKEEGO_ALLOW_DEBUG_SIGNED_RELEASE=true
// ── JS 번들 신선도 검사(2026-07-30) ─────────────────────────────────────────
// 위 :206 에서 in-Gradle 번들링을 **일부러 꺼놨다**(Gradle 9 + RNGP 호환 문제). 대신
// `npm run bundle:android` 로 미리 구운 번들을 src/main/assets 에 두고 그걸 패키징한다.
// 문제: 그 명령을 깜빡하면 **옛 번들이 그대로 포장되고 아무도 모른다.** 실제로 2026-07-08
// 번들이 3주 내내 포장돼, 그 사이의 모든 화면·문구 변경이 안드로이드에만 빠져 있었다
// (카카오 로고가 구 글자 "K" 로 나오던 증상). 빌드는 성공하고 앱도 켜지므로 무증상이다.
// 그래서 **소스가 번들보다 새로우면 빌드를 세운다.** 사람의 기억에 기대지 않는다.
def newestJsSourceMs(File root) {
    long newest = 0L
    def rx = ~/.*\.(ts|tsx|js|jsx|json)$/
    ['lib', 'screens', 'data', 'services', 'types'].each { name ->
        def d = new File(root, name)
        if (!d.exists()) return
        d.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name ==~ rx && f.lastModified() > newest) newest = f.lastModified()
        }
    }
    root.listFiles()?.each { f ->
        // 루트의 화면 파일들(App.tsx·*.rn.tsx·theme.ts·index.js 등). package-lock 은 번들
        // 내용과 무관하므로 제외한다(의미 없는 실패를 만들지 않기 위해).
        if (f.isFile() && f.name ==~ rx && f.name != 'package-lock.json' && f.lastModified() > newest) {
            newest = f.lastModified()
        }
    }
    return newest
}

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { t ->
        t.name == 'assembleRelease' || t.name == 'bundleRelease'
    }
    if (!buildsRelease) return

    if (!project.hasProperty('KEEGO_SKIP_BUNDLE_CHECK')) {
        def bundleFile = file('src/main/assets/index.android.bundle')
        if (!bundleFile.exists()) {
            throw new GradleException(
                'JS 번들이 없습니다: android/app/src/main/assets/index.android.bundle\n' +
                '  이대로 만들면 앱이 흰 화면으로 뜹니다.\n' +
                '  → npm run bundle:android   (또는 npm run build:android:release 로 한 번에)')
        }
        def newestSrc = newestJsSourceMs(rootDir.getAbsoluteFile().getParentFile())
        if (newestSrc > bundleFile.lastModified()) {
            def fmt = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm')
            throw new GradleException(
                'JS 번들이 낡았습니다 — 소스가 더 최신입니다.\n' +
                "  번들: ${fmt.format(new Date(bundleFile.lastModified()))}\n" +
                "  소스: ${fmt.format(new Date(newestSrc))}\n" +
                '  이대로 만들면 **옛 화면·옛 문구가 담긴 앱**이 나오고, 빌드는 성공하며\n' +
                '  앱도 켜지기 때문에 아무도 눈치채지 못합니다(2026-07-30 실제 사고).\n' +
                '  → npm run bundle:android   (또는 npm run build:android:release 로 한 번에)')
        }
    }
    if (project.hasProperty('KEEGO_ALLOW_DEBUG_SIGNED_RELEASE')) {
        logger.warn('⚠️  KEEGO: debug 서명 release 빌드입니다 — 스토어에 업로드하지 마세요.')
        return
    }
    def storeFile = project.findProperty('KEEGO_UPLOAD_STORE_FILE')
    if (!storeFile) {
        throw new GradleException(
            '출시 서명 키가 없습니다(KEEGO_UPLOAD_STORE_FILE 미설정).\n' +
            '  이대로 만들면 debug 키로 서명돼 Play 가 업로드를 거부합니다.\n' +
            '  · 출시용: ~/.gradle/gradle.properties 에 KEEGO_UPLOAD_* 4개를 설정하세요.\n' +
            '  · 기기 테스트용이면: -PKEEGO_ALLOW_DEBUG_SIGNED_RELEASE=true 를 붙이세요.')
    }
    if (!file(storeFile).exists()) {
        throw new GradleException(
            "출시 서명 keystore 파일을 찾을 수 없습니다: ${storeFile}\n" +
            '  경로가 바뀌었거나 파일이 사라졌습니다. **이 파일을 잃으면 앱 업데이트가 영구히\n' +
            '  불가능합니다** — 백업본에서 복구하세요.')
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Lint-vital on release assembly analyzes every native module and exhausts JVM
    // Metaspace; it is not needed to produce a runnable APK. Skip it for release builds.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace "com.keego.app"
    defaultConfig {
        applicationId "com.keego.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 버전 체계: 정본은 **android/gradle.properties** 다(저장소에 기록된다).
        // CI 는 `-PKEEGO_VERSION_CODE=…` 로 여전히 덮어쓸 수 있다.
        //
        // ⚠️ **기본값을 두지 않는다.** 예전엔 미설정 시 조용히 `1` 로 떨어졌는데, 그게
        // 2026-08-10 에 실제로 물었다: 문서화된 명령으로 빌드한 APK 가 versionCode 1 이라
        // 폰 설치가 INSTALL_FAILED_VERSION_DOWNGRADE 로 거부됐다(폰은 22). Play 에 올렸다면
        // 그냥 반려다. 잘못된 값으로 **성공하는 빌드**보다 여기서 멈추는 편이 낫다.
        //
        // 지역 변수로 분리 — `versionCode (…)` 공백이 Groovy 에서 인자 아닌 반환값 체이닝으로
        // 파싱돼 null.toString() 으로 터지던 것 방지(카카오 키와 동일 패턴).
        // ⚠️ **findProperty 를 쓰지 않는다.** Gradle 은 `~/.gradle/gradle.properties`(개발자
        // 홈)가 프로젝트 파일을 **이긴다.** 그래서 홈에 남은 낡은 값이 저장소 값을 조용히
        // 덮었다 — 2026-08-11 실측: 홈 `14`/`1.0.0` 이 저장소 `23`/`1.0` 을 이기고 있었고,
        // 그 결과 **폰에 versionName 1.0.0 이 깔려 있었다**(iOS 는 1.0). 아래 주석이
        // 2026-08-08 부터 "같아야 한다"고 요구하던 바로 그 불일치가 이미 나가 있었던 것이다.
        //
        // 그래서 저장소 파일을 **직접 읽는다.** 홈 값은 무시된다(있어도 무해해진다).
        // 명령줄 `-P` 만 예외로 이긴다 — `startParameter.projectProperties` 에는
        // **명령줄로 넘긴 것만** 들어 있어서 홈 파일과 정확히 구분된다.
        def repoProps = new Properties()
        file("${rootDir}/gradle.properties").withInputStream { repoProps.load(it) }
        def cliProps = project.gradle.startParameter.projectProperties
        def repoVersionCode = repoProps.getProperty('KEEGO_VERSION_CODE')
        if (repoVersionCode == null) {
            throw new GradleException(
                'android/gradle.properties 에 KEEGO_VERSION_CODE 가 없습니다.\n' +
                '  예전엔 이 값이 없으면 조용히 1 로 빌드돼, 폰 설치는 거부되고\n' +
                '  Play 업로드는 반려됐습니다(원인이 빌드 명령에 안 보여 찾기 어렵습니다).')
        }
        def keegoVersionCode = (cliProps['KEEGO_VERSION_CODE'] ?: repoVersionCode).toString().toInteger()
        // ⚠️ iOS 의 MARKETING_VERSION 과 **같은 문자열**이어야 한다(2026-08-08 정합).
        // 예전엔 iOS 가 `1.0`, 안드로이드 기본이 `1.0.0` 이라 두 스토어에 다른 버전이
        // 올라갈 뻔했다. 사용자 문의·크래시 리포트가 버전으로 묶이는데 그게 갈리면
        // "1.0 에서만 나는 버그"를 추적할 수 없다.
        // versionName 도 같은 이유로 저장소 파일이 정본이다(위 주석 참조).
        def repoVersionName = repoProps.getProperty('KEEGO_VERSION_NAME')
        if (repoVersionName == null) {
            throw new GradleException('android/gradle.properties 에 KEEGO_VERSION_NAME 이 없습니다.')
        }
        def keegoVersionName = (cliProps['KEEGO_VERSION_NAME'] ?: repoVersionName).toString()
        versionCode keegoVersionCode
        versionName keegoVersionName
        // 카카오 네이티브 앱 키는 공개 저장소에 두지 않는다 — ~/.gradle/gradle.properties 의
        // KAKAO_NATIVE_APP_KEY 에서 읽어 (1) kakao_app_key 문자열 리소스(KakaoSdk.init 가
        // 읽음)와 (2) AndroidManifest redirect scheme(kakao<KEY>) 플레이스홀더로 주입한다.
        def kakaoNativeAppKey = (project.findProperty('KAKAO_NATIVE_APP_KEY') ?: '').toString()
        resValue "string", "kakao_app_key", kakaoNativeAppKey
        manifestPlaceholders = [kakaoNativeAppKey: kakaoNativeAppKey]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 업로드(release) 서명 — 비밀값은 저장소에 두지 않는다(~/.gradle/gradle.properties 또는
        // CI 시크릿/-P 로 주입). KEEGO_UPLOAD_STORE_FILE 가 설정된 경우에만 구성한다.
        release {
            def uploadStoreFile = project.findProperty('KEEGO_UPLOAD_STORE_FILE')
            if (uploadStoreFile) {
                storeFile file(uploadStoreFile)
                storePassword (project.findProperty('KEEGO_UPLOAD_STORE_PASSWORD') ?: '').toString()
                keyAlias (project.findProperty('KEEGO_UPLOAD_KEY_ALIAS') ?: '').toString()
                keyPassword (project.findProperty('KEEGO_UPLOAD_KEY_PASSWORD') ?: '').toString()
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 업로드 keystore 가 설정돼 있으면 그것으로 서명(스토어 제출용), 아니면 로컬 개발
            // 편의를 위해 debug 로 폴백한다. **출시 빌드는 반드시 KEEGO_UPLOAD_* 설정 후 수행.**
            signingConfig project.hasProperty('KEEGO_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// RNGP 0.85.3 + Gradle 9: the JS bundling task (createBundle*JsAndAssets) declares
// `sources = fileTree(<projectRoot>)`, whose root directory contains android/app/build.
// Gradle's strict implicit-dependency validation then flags every :app task that writes
// under android/app as an undeclared input producer — an unbounded whack-a-mole that
// excludes/mustRunAfter cannot fully resolve. Instead we disable the in-Gradle bundling
// task and rely on a pre-generated JS bundle placed at
// android/app/src/main/assets/index.android.bundle (see scripts/bundle-android-release.sh),
// which mergeRelease{Assets,Resources} packages as ordinary source assets.
tasks.matching { it.name ==~ /createBundle.*ReleaseJsAndAssets/ }.configureEach { it.enabled = false }
