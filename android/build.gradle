buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        // 24 → 26 (2026-08-06). Health Connect(androidx.health.connect:connect-client)가
        // minSdk 26 을 요구한다. 매니페스트 머지가 그래서 막혔다.
        //
        // tools:overrideLibrary 로 우회할 수도 있었지만 쓰지 않았다 — 구글 자신이 "런타임
        // 실패 가능"이라고 경고하는 방법이고, 심박을 얻자고 크래시를 심는 건 거래가 안 맞는다.
        //
        // 잃는 것: 안드로이드 7.0/7.1(API 24·25) 기기. **그 기기들은 어차피 심박을 못 받는다**
        // — Health Connect 자체가 26+ 이기 때문이다. 즉 여기서 배제되는 사용자는 '심박 없는
        // 안드로이드'가 아니라 처음부터 대상이 아니었던 쪽이다. 국내 유통 기기 중 이 구간은
        // 사실상 없다(갤럭시 S8 도 안드로이드 9 까지 올라갔다).
        //
        // 되돌리려면: 이 값을 24 로 내리고 react-native-health-connect 를 제거해야 한다.
        // 둘은 함께 간다.
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // @react-native-firebase: google-services.json 을 빌드에 반영(앱 모듈에서 apply).
        // 버전은 @react-native-firebase/app sdkVersions.android.gmsGoogleServicesGradle 와 일치.
        classpath("com.google.gms:google-services:4.4.4")
        // @react-native-firebase/crashlytics: 크래시 심볼/매핑 업로드용 Gradle 플러그인
        // (앱 모듈에서 apply). RNFirebase v24 와 호환되는 3.0.x 라인.
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo"
        }
    }
}
apply plugin: "expo-root-project"
