# "한 화면 뒤로" — **플랫폼마다 물리적으로 다른 동작이다.**
#
# 이걸 서브플로우로 뽑은 이유: 흐름 파일을 안드로이드용/아이폰용으로 복제하면 둘이
# 반드시 어긋난다(한쪽만 고치는 날이 온다). 다른 건 '뒤로 가는 동작' 한 줄뿐이므로
# 그 한 줄만 여기로 모은다.
#
#  · 안드로이드 — **하드웨어 뒤로가기 버튼.** OS 가 앱에 이벤트를 보내고 App.tsx 의
#    BackHandler 가 받는다(lib/backStack).
#  · 아이폰      — **왼쪽 가장자리 스와이프.** 그런 버튼이 아예 없다. 앱은
#    primitives.SwipeBack 의 PanResponder 로 직접 구현했다.
#
# ⚠️ 아이폰 스와이프 좌표는 아무 데서나 시작하면 안 된다. SwipeBack 의 인식 조건이
# 빡빡하다(primitives.tsx:1402):
#     g.x0 <= 24pt          ← 화면 왼쪽 가장자리 24pt 안에서 시작해야 한다
#     g.dx > 14 · |g.dy| < 12 · dx > |dy|*2.5    ← 거의 완전한 수평이어야 한다
#     놓을 때 dx > 화면폭/3 또는 vx > 0.5        ← 충분히 멀리 or 빠르게
# 그래서 3%(아이폰 17 Pro 기준 약 12pt)에서 시작해 85% 까지, 수직 이동 0 으로 민다.
# 이 값을 건드리면 제스처가 조용히 안 먹고 흐름이 "화면이 안 닫힘"으로 실패한다.
appId: com.keego.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back

- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "3%, 50%"
          end: "85%, 50%"
          duration: 250
