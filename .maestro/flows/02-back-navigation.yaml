# 안드로이드 하드웨어 뒤로가기 — **실제 사고의 회귀 테스트**.
#
# 2026-08-07 갤럭시 S10e 실측: 기록 상세에서 시스템 뒤로가기를 눌렀더니 목록으로
# 돌아가는 게 아니라 **앱이 통째로 종료됐다**. 저장소 전체에 BackHandler 가 0건이었다.
#
# 단위 테스트 3,477개가 이걸 못 잡았다 — 잡을 수가 없다. 버그가 "JS 함수의 반환값"이
# 아니라 "OS 버튼이 앱에 도달하는가"에 있었기 때문이다. **이 흐름이 E2E 를 넣은
# 이유 그 자체**다. 지우거나 약화시키지 말 것.
appId: com.keego.app
name: 02 뒤로가기 — 상세 → 목록 → 홈 → 종료
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "tab-history"
- extendedWaitUntil:
    visible:
      id: "history-screen"
    timeout: 15000

# 기록이 하나도 없는 계정에서는 열 상세가 없다. 그때는 이 흐름을 건너뛴다 —
# 없는 데이터를 만들어 가며 검사하지 않는다(비파괴 원칙).
- runFlow:
    when:
      visible:
        id: "run-card"
    commands:
      - tapOn:
          id: "run-card"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "run-detail-screen"
          timeout: 15000

      # ① 상세 → 목록. 예전엔 여기서 앱이 죽었다.
      - pressKey: Back
      - extendedWaitUntil:
          visible:
            id: "history-screen"
          timeout: 10000
      - assertNotVisible:
          id: "run-detail-screen"

# ② 홈이 아닌 탭 → 홈 탭(안드로이드 표준 동선).
- assertVisible:
    id: "history-screen"
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# ③ 홈에서 한 번 더 → 앱이 백그라운드로. 여기서만 나가야 한다.
- pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: "home-screen"
    timeout: 10000
