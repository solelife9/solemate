# ============================================================================
# .maestro/config.yaml — E2E(Maestro) 설정
# ============================================================================
# 실행: npm run e2e        (전체)
#       npm run e2e -- .maestro/flows/02-back-navigation.yaml   (하나만)
#
# **왜 Maestro 인가.** RN E2E 의 현재 표준은 Detox 와 Maestro 둘인데 이 저장소엔
# Maestro 가 맞다:
#   · 네이티브 코드·의존성을 **하나도 안 건드린다**(Detox 는 빌드 설정과 테스트 러너를
#     앱에 심어야 한다). 이 프로젝트는 네이티브 의존성 사전 승인제라 그 차이가 크다.
#   · **릴리스 APK 그대로** 검사한다 — 실제로 스토어에 올릴 바이너리를 테스트한다.
#   · Expo 공식 권장이고, 흐름이 YAML 이라 리뷰가 쉽다.
#
# ⚠️ **로그인된 기기가 필요하다.** 앱은 로그인이 필수 게이트라(소셜 로그인 4종) 갓
# 초기화한 에뮬레이터에서는 로그인 화면에서 멈춘다. 흐름들은 그 상태를 감지해
# "먼저 로그인하라"고 명확히 실패한다(조용히 통과하지 않는다).
# 자동화하려면 E2E 전용 인증 우회 시드가 필요한데, 그건 보안 영향이 있어
# 민우님 승인 없이 넣지 않았다(docs/e2e.md 참조).
#
# ⚠️ 모든 흐름은 **비파괴**다 — 러닝을 만들지도, 기록을 지우지도, 신발을 등록하지도
# 않는다. 실기기(민우님 폰)에서 그대로 돌려야 하기 때문이다. 새 흐름을 넣을 때도
# 이 선을 지킨다. 데이터를 만드는 검증이 필요하면 별도 디렉터리로 분리하고
# 에뮬레이터 전용으로 표시할 것.
# ============================================================================
appId: com.keego.app
flows:
  - flows/*.yaml
