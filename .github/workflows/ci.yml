# ============================================================================
# Keego CI — Iron Law 게이트 자동화 (2026-07-27, 출시 심사 앞당김 #49)
# ----------------------------------------------------------------------------
# 왜: 혼자 개발 + PR 리뷰 없음 = **게이트가 유일한 심판**인데 지금까지 수동이었다.
# 실제로 2026-07-27 에 tsc 가 실패한 커밋이 그대로 푸시된 적이 있다(`&&` 체인 오용).
# 사람이 매번 기억할 일이 아니라 기계가 막을 일이다.
#
# CLAUDE.md Iron Law: 머지 전 `tsc` · `lint` · `test` 전부 통과 + 커버리지 ≥ 60%.
# 규칙(firestore.rules)은 앱 테스트가 목으로 대체해 검증하지 못하므로 별도 잡에서
# 에뮬레이터로 돌린다(2026-07-26 심사 B-01 이 그래서 살아남았다).
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연속 푸시하면 앞 실행을 취소한다(러너 시간 절약).
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 타입·린트·테스트·커버리지
    runs-on: ubuntu-latest
    # 20분인 이유(2026-08-04 3차 실측): 문제는 '느림'이 아니라 '멈춤'이었다 — 아래 테스트
    # 스텝 주석 참조. 타임아웃을 45분으로 늘렸던 것은 오진이었고, 멈춘 잡을 45분씩 붙잡고
    # 있게 만들 뿐이었다. 정상 실행은 몇 분이면 끝난다. **길게 두면 고장을 늦게 알 뿐이다.**
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 버전을 여기 적지 않는다 — `.nvmrc` 가 단일 소스다.
          # 왜(2026-08-04, CI 5회 실패의 진짜 원인): 여기엔 '22' 가 박혀 있었는데 개발 기기는
          # Node 26 이었다. **아무도 쓰지 않는 버전에서 게이트를 돌리고 있었고**, 테스트 스위트가
          # 거기서 매달린다(로컬 Node 22 로 CI 와 같은 시간까지 재현: runTracker 150s ·
          # App.bootcache 270s — 전부 제한 시간 초과, 단언 실패 0. 같은 코드가 Node 26 에서는
          # 284스위트 3,164테스트를 31초에 통과한다).
          # 버전을 두 곳이 들면 반드시 어긋난다 — 이 저장소가 데이터에서 세 번 겪은 병이다
          # (docs/audit/04-data-quality.md). 그래서 파일 하나로 모았다.
          node-version-file: .nvmrc
          cache: npm

      # jest 변환 캐시를 실행 간에 보존한다. 이게 없으면 매번 전체 babel 변환을 다시 한다.
      #
      # ⚠️ 경로를 **명시**해야 한다. 예전엔 `/tmp/jest_rs` 를 캐시했는데 그건 jest 기본
      # 캐시 경로를 추측한 값이다(`os.tmpdir()/jest_<uid를 36진수로>`). 러너 uid 가 다르면
      # 아무것도 안 잡히는, **조용히 아무 일도 하지 않는 캐시 스텝**이 된다. 아래 테스트
      # 스텝에서 `--cacheDirectory` 로 같은 경로를 강제해 추측을 없앤다.
      # 키에 lock/babel/jest 설정을 넣어 의존성이 바뀌면 자동 무효화.
      - name: jest 캐시
        uses: actions/cache@v4
        with:
          path: /tmp/jest_ci
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.js', 'jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-

      # postinstall 의 patch-package 까지 그대로 태운다(로컬과 같은 트리).
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      # --max-warnings 래칫이 걸려 있어 경고가 늘면 여기서 실패한다.
      - name: 린트
        run: npm run lint

      # ── 5회 연속 잘렸다. 원인은 Node 버전이었다(2026-08-04) ────────────────────
      # run 30905338977 · 30906938251 · 30909800019 · 30919038478 · 30921094696.
      #
      # 틀린 진단 두 개를 먼저 적는다(같은 길을 다시 가지 않기 위해):
      #   ① "워커 풀이 죽는다" → 틀렸다. 워커를 없앤 실행도 똑같이 멎었다.
      #   ② "러너가 느려 기본 5초를 넘긴다" → 절반만 맞다. 제한을 30초로 올리자 같은
      #      테스트가 30초를 꽉 채웠다(150s = 30×5, 270s = 30×9). 느린 게 아니라 매달린 것이다.
      #
      # 진짜 차이는 **Node 버전**이었다. 위 setup-node 주석 참조 — 로컬 Node 22 로 CI 와
      # 같은 시간까지 재현했고, Node 26 에서는 같은 코드가 31초에 전량 통과한다.
      #
      # `--runInBand` 와 `testTimeout: 30000`(jest.config.js)은 남겼다. 원인은 아니었지만
      # 둘 다 그 자체로 옳다 — 이 저장소는 렌더 스위트의 메모리 압력으로 워커가 죽은 전력이
      # 있고(`jest.coverage.config.js` 주석), App 트리를 통째로 렌더하는 스위트는 느린
      # 기기에서 5초를 정당하게 넘긴다.
      #
      # ⚠️ **Node 22 에서 매다는 것 자체는 미해결이다.** `engines` 는 여전히 >= 22.11.0 이라
      # 다른 사람이 22 로 받으면 같은 일을 겪는다. 원인 규명은 별건으로 남긴다
      # (docs/audit/FINAL-readiness.md).
      #
      # ⚠️ "고쳤다"의 근거는 이 주석이 아니라 **초록 실행 1회**다. 그 전까지 게이트는 없다.
      - name: 테스트
        run: npm test -- --ci --runInBand --cacheDirectory /tmp/jest_ci

      # lib/ 비즈니스 로직 커버리지 임계(jest.coverage.config.js).
      # 이쪽은 순수 로직 스위트만 돌아 가볍지만, 같은 이유로 워커를 쓰지 않는다.
      - name: 커버리지 게이트
        run: npm run test:coverage -- --runInBand --cacheDirectory /tmp/jest_ci

  rules:
    name: Firestore 보안 규칙
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 여기에도 버전을 적지 않는다 — `.nvmrc` 가 단일 소스다(위 잡의 주석과 같은 이유).
          # 2026-08-07 까지 이 줄만 '22' 로 박혀 있었다. 규칙 잡은 App 스위트를 돌리지 않아
          # 우연히 초록이었지만, **Node 22 에서는 앱 테스트가 매달린다**(실측 22.11·22.20 ✗ /
          # 24.11·26.3 ✓). 두 잡이 다른 Node 를 쓰는 상태 자체가 다음 사고의 씨앗이다.
          node-version-file: .nvmrc
          cache: npm

      # firebase-tools 15+ 의 에뮬레이터는 JDK 21+ 를 요구한다.
      # 로컬에서는 scripts/jdk21-home.sh 가 brew keg 를 찾지만(안드로이드 Gradle 이 JDK17 에
      # 묶여 전역 전환 금지), CI 에는 JDK 가 하나뿐이므로 JAVA21_HOME 로 직접 알려준다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 의존성 설치
        run: npm ci

      - name: 규칙 계약 테스트
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME }}
        run: npm run test:rules
